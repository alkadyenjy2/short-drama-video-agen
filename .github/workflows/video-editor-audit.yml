name: video-editor-audit
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-freefont-ttf
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax audit
        run: python -m py_compile bot.py health.py video_editor.py persistence/repository.py
      - name: Run editor audit
        run: python -m unittest test_video_editor_audit.py -v
      - name: Run runtime pipeline audit
        run: python -m unittest test_runtime_pipeline_audit.py -v
